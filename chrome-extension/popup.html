<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 240px;
      padding: 16px;
      margin: 0;
      background-color: #f7f9fc;
    }
    h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #409EFF;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #66b1ff;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #67c23a;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Auto Mock</h3>
  <button id="fillBtn">一键全量填充</button>
  <button id="spotlightBtn" style="margin-top: 10px; background-color: #67c23a;">唤出悬浮控制台</button>
  <button id="optionsBtn" style="margin-top: 10px; background-color: #909399;">⚙️ 高级偏好设置</button>
  <div id="status" class="status">指令已发送！</div>
  <script src="popup.js"></script>
</body>
</html>
